<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Kelulusan - SMPN 4 Kedungreja</title>
    
    <!-- Script Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { darkBg: '#0f172a' } } }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: white; overflow-x: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        .blob { position: absolute; filter: blur(80px); z-index: -1; opacity: 0.6; animation: moveBlob 10s infinite alternate; }
        @keyframes moveBlob { from { transform: translate(0, 0) scale(1); } to { transform: translate(20px, -50px) scale(1.1); } }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .glass-input { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; }
        .glass-input:focus { outline: none; border-color: rgba(96, 165, 250, 0.5); box-shadow: 0 0 15px rgba(96, 165, 250, 0.2); }
        .hidden-el { display: none !important; }
    </style>
</head>
<body class="antialiased min-h-screen relative flex items-center justify-center p-4">

    <div class="blob bg-blue-600 w-64 h-64 rounded-full top-10 left-10"></div>
    <div class="blob bg-purple-600 w-72 h-72 rounded-full bottom-10 right-10" style="animation-delay: -5s"></div>

    <!-- UI Aplikasi Utama -->
    <div class="glass-panel rounded-3xl p-8 w-full max-w-md relative z-10 transition-all duration-500">
        <div class="text-center mb-8">
            <img src="https://site.smpn4kedungreja.sch.id/jurnalgcp/wp-content/uploads/2026/02/Logo-Satap.png" alt="Logo Sekolah" class="h-24 w-auto mx-auto mb-4 opacity-95 drop-shadow-lg object-contain" />
            <h1 class="text-2xl font-bold text-white tracking-wide">Pengumuman Kelulusan</h1>
			<h1 class="text-2xl font-bold text-white tracking-wide">SMPN 4 SATU ATAP KEDUNGREJA</h1>
            <p class="text-gray-300 text-sm mt-1">Tahun Ajaran 2025/2026</p>
        </div>

        <!-- Bagian Countdown Timer -->
        <div id="countdown-container" class="hidden-el text-center mb-6">
            <h2 class="text-lg text-gray-300 mb-4">Pengumuman akan dibuka dalam:</h2>
            <div class="flex justify-center gap-3 text-white">
                <div class="glass-input p-3 rounded-xl min-w-[65px]">
                    <span id="cd-days" class="text-2xl font-bold text-blue-400">00</span>
                    <p class="text-[10px] text-gray-400 mt-1 tracking-wider">HARI</p>
                </div>
                <div class="glass-input p-3 rounded-xl min-w-[65px]">
                    <span id="cd-hours" class="text-2xl font-bold text-blue-400">00</span>
                    <p class="text-[10px] text-gray-400 mt-1 tracking-wider">JAM</p>
                </div>
                <div class="glass-input p-3 rounded-xl min-w-[65px]">
                    <span id="cd-minutes" class="text-2xl font-bold text-blue-400">00</span>
                    <p class="text-[10px] text-gray-400 mt-1 tracking-wider">MENIT</p>
                </div>
                <div class="glass-input p-3 rounded-xl min-w-[65px]">
                    <span id="cd-seconds" class="text-2xl font-bold text-blue-400">00</span>
                    <p class="text-[10px] text-gray-400 mt-1 tracking-wider">DETIK</p>
                </div>
            </div>
        </div>

        <form id="form-pencarian" class="space-y-5 hidden-el">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Masukkan NISN</label>
                <input type="number" id="input-nisn" placeholder="Contoh: 1234567890" class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-gray-400 focus:ring-0" required />
            </div>
            <div id="error-message" class="hidden-el bg-red-500/20 border border-red-500/50 text-red-200 text-sm p-3 rounded-lg flex items-center">
                <span id="error-text"></span>
            </div>
            <button type="submit" id="btn-submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-[0_0_15px_rgba(37,99,235,0.4)] flex justify-center items-center">
                <span id="btn-text">Cek Status Kelulusan</span>
                <svg id="btn-loading" class="hidden-el animate-spin -ml-1 mr-3 h-5 w-5 text-white absolute" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </form>

        <div id="hasil-pencarian" class="hidden-el">
            <div class="text-center mb-6">
                <h2 class="text-lg text-gray-300">Hasil Pencarian NISN</h2>
                <p id="hasil-nisn" class="text-xl font-mono font-bold text-blue-400 tracking-wider mt-1"></p>
            </div>

            <div class="bg-black/30 rounded-xl p-5 mb-4 border border-white/10">
                <p class="text-sm text-gray-400 mb-1">Nama Siswa</p>
                <p id="hasil-nama" class="text-lg font-semibold text-white mb-4"></p>
                <p class="text-sm text-gray-400 mb-2">Status</p>
                <div id="hasil-status" class="text-2xl font-black tracking-widest p-3 rounded-lg text-center border"></div>
            </div>
            
            <div class="bg-white/5 border border-white/10 rounded-xl p-5 mb-6">
                <div class="flex items-center mb-3">
                    <svg class="w-5 h-5 text-blue-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
                    <h3 class="font-semibold text-gray-200">Papan Pengumuman</h3>
                </div>
                <p id="hasil-pengumuman" class="text-sm text-gray-300 leading-relaxed"></p>
            </div>

            <!-- TOMBOL BUKA/DOWNLOAD FILE SCAN -->
            <button type="button" id="btn-download" class="hidden-el w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition duration-300 shadow-[0_0_15px_rgba(16,185,129,0.4)] mb-4 flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                <span id="btn-download-text">Lihat Surat Kelulusan Asli</span>
            </button>

            <button type="button" id="btn-kembali" class="w-full bg-transparent border border-gray-500 hover:border-gray-300 text-gray-300 hover:text-white font-medium py-3 rounded-xl transition duration-300">Kembali</button>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // ====================================================================
            // ⚠️ KONFIGURASI URL BACKEND ⚠️
            // GANTI STRING DI BAWAH INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
            // ====================================================================
            const GAS_URL = "https://script.google.com/macros/s/AKfycbzW_kr269CuA-uNF6wkYOErChzHqCXHJDIhhZUogFy9K6aRFkapfm8D3DQJgB7j3yU/exec";
            
            const form = document.getElementById('form-pencarian');
            const inputNisn = document.getElementById('input-nisn');
            const btnSubmit = document.getElementById('btn-submit');
            const btnText = document.getElementById('btn-text');
            const btnLoading = document.getElementById('btn-loading');
            const divForm = document.getElementById('form-pencarian');
            const divHasil = document.getElementById('hasil-pencarian');
            const errorContainer = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            
            // Variabel Global Data Siswa
            let currentSiswaData = null;

            // --- LOGIKA COUNTDOWN TIMER ---
            const countdownContainer = document.getElementById('countdown-container');
            const targetDate = new Date("2026-06-02T14:00:00+07:00").getTime();

            const timerInterval = setInterval(function() {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance <= 0) {
                    clearInterval(timerInterval);
                    countdownContainer.classList.add('hidden-el');
                    divForm.classList.remove('hidden-el');
                } else {
                    divForm.classList.add('hidden-el');
                    countdownContainer.classList.remove('hidden-el');

                    document.getElementById('cd-days').textContent = Math.floor(distance / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
                    document.getElementById('cd-hours').textContent = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                    document.getElementById('cd-minutes').textContent = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                    document.getElementById('cd-seconds').textContent = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
                }
            }, 1000);

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                const nisn = inputNisn.value.trim();
                
                if(nisn === '') {
                    errorText.textContent = 'NISN tidak boleh kosong';
                    errorContainer.classList.remove('hidden-el');
                    return;
                }
                
                errorContainer.classList.add('hidden-el');

                // --- MOCK UP UNTUK TEST (Hapus jika URL asli sudah dimasukkan) ---
                if(GAS_URL.includes("REPLACE_WITH")) {
                    btnText.classList.add('hidden-el'); btnLoading.classList.remove('hidden-el');
                    setTimeout(() => {
                        currentSiswaData = { 
                            nisn: nisn, 
                            nama: 'Budi Santoso', 
                            status: 'LULUS', 
                            link_surat: 'https://drive.google.com/file/d/contoh_link_file/view' // Link contoh
                        };
                        showResult(currentSiswaData, 'Pengumuman contoh untuk simulasi.');
                        btnText.classList.remove('hidden-el'); btnLoading.classList.add('hidden-el');
                    }, 1000);
                    return;
                }

                btnText.classList.add('hidden-el'); btnLoading.classList.remove('hidden-el');
                btnSubmit.disabled = true;

                try {
                    const response = await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({ nisn: nisn }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        currentSiswaData = { 
                            nisn: nisn, 
                            nama: data.data.siswa.nama, 
                            status: data.data.siswa.status,
                            link_surat: data.data.siswa.link_surat 
                        };
                        showResult(currentSiswaData, data.data.pengumuman);
                    } else {
                        errorText.textContent = data.message || 'Data tidak ditemukan.';
                        errorContainer.classList.remove('hidden-el');
                    }
                } catch (err) {
                    errorText.textContent = 'Terjadi kesalahan server.';
                    errorContainer.classList.remove('hidden-el');
                } finally {
                    btnText.classList.remove('hidden-el'); btnLoading.classList.add('hidden-el');
                    btnSubmit.disabled = false;
                }
            });

            function showResult(data, pengumuman) {
                divForm.classList.add('hidden-el');
                divHasil.classList.remove('hidden-el');
                
                document.getElementById('hasil-nisn').textContent = data.nisn;
                document.getElementById('hasil-nama').textContent = data.nama;
                document.getElementById('hasil-pengumuman').textContent = pengumuman;
                
                const elStatus = document.getElementById('hasil-status');
                elStatus.textContent = data.status;
                elStatus.className = "text-2xl font-black tracking-widest p-3 rounded-lg text-center border " + 
                    (data.status === 'LULUS' ? "bg-emerald-500/20 border-emerald-500/50 text-emerald-400 shadow-[0_0_20px_rgba(16,185,129,0.2)]" : "bg-red-500/20 border-red-500/50 text-red-400 shadow-[0_0_20px_rgba(239,68,68,0.2)]");
                
                // Menampilkan tombol lihat scan surat JIKA link tersedia di Google Sheets
                const btnDownload = document.getElementById('btn-download');
                if(data.link_surat && data.link_surat.trim() !== '') {
                    btnDownload.classList.remove('hidden-el');
                    
                    const newBtnDownload = btnDownload.cloneNode(true);
                    btnDownload.parentNode.replaceChild(newBtnDownload, btnDownload);
                    
                    newBtnDownload.addEventListener('click', function() {
                        window.open(data.link_surat, '_blank');
                    });
                } else {
                    btnDownload.classList.add('hidden-el');
                }
            }

            document.getElementById('btn-kembali').addEventListener('click', function() {
                divHasil.classList.add('hidden-el');
                divForm.classList.remove('hidden-el');
                inputNisn.value = '';
                currentSiswaData = null;
            });
        });
    </script>
</body>
</html>
